    <h1>觀音集慶堂 擇日舘</h1>
    <h2>傳承一甲子 · 擇日、堪輿與傳統科儀</h2>

    <p>觀音集慶堂擇日舘由謝開明老師創立，迄今已逾一甲子。現由謝泰臺老師主持，承襲家父謝開明老師之擇日學脈，延續一脈相承的學理與實務經驗。</p>

    <p>本舘服務項目包括擇日（入宅、嫁娶、開市等各類吉日）、地理堪輿、命名、開光安香及酧神還愿等傳統科儀。</p>

    <p>館內另售有佛具、神桌、金香等各式祭祀用品，日常敬神、年節祭祖所需，皆可一併備齊。</p>
